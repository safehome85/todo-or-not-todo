version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itsm_db}
      POSTGRES_USER: ${POSTGRES_USER:-itsm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itsm_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-default-insecure-key-do-not-use-in-prod}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*,localhost,127.0.0.1}
      - DATABASE_URL=postgres://${POSTGRES_USER:-itsm_user}:${POSTGRES_PASSWORD:-itsm_password}@db:5432/${POSTGRES_DB:-itsm_db}
    depends_on:
      - db

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

volumes:
  postgres_data:
